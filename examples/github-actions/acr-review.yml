name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required to post reviews

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Important: Fetch the PR branch to allow the local lexer/indexer to run against the new code.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build AI Code Reviewer
        run: pnpm build:packages

      - name: Run AI Code Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Use pnpm to execute the CLI package
          pnpm --filter @acr/cli exec acr-review --pr ${{ github.event.pull_request.html_url }}
